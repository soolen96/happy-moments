<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 800" width="1280" height="800">
  <defs>
    <!-- Fonts -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap');
      .font-heading { font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif; }
      .font-body { font-family: 'Plus Jakarta Sans', sans-serif; }
      .card-shadow { filter: drop-shadow(0px 16px 36px rgba(90, 24, 70, 0.12)); }
      .modal-shadow { filter: drop-shadow(0px 24px 50px rgba(55, 10, 42, 0.22)); }
      .glow-green { filter: drop-shadow(0px 8px 20px rgba(82, 183, 55, 0.35)); }
      .glow-magenta { filter: drop-shadow(0px 8px 20px rgba(232, 59, 135, 0.35)); }
    </style>

    <!-- Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCF1ED" />
      <stop offset="50%" stop-color="#FDF6F2" />
      <stop offset="100%" stop-color="#F5E5DC" />
    </linearGradient>

    <linearGradient id="green-btn-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#52B737" />
      <stop offset="100%" stop-color="#3E9427" />
    </linearGradient>

    <linearGradient id="magenta-badge-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E83B87" />
      <stop offset="100%" stop-color="#C4206B" />
    </linearGradient>

    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5B729" />
      <stop offset="100%" stop-color="#D99B14" />
    </linearGradient>

    <linearGradient id="card-surface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.9" />
    </linearGradient>

    <!-- Brownie Texture Mockup -->
    <linearGradient id="brownie-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4a2211" />
      <stop offset="50%" stop-color="#2d1307" />
      <stop offset="100%" stop-color="#1f0a03" />
    </linearGradient>

    <linearGradient id="arequipe-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cf7d21" />
      <stop offset="50%" stop-color="#f0a843" />
      <stop offset="100%" stop-color="#cf7d21" />
    </linearGradient>

    <clipPath id="card-img-clip">
      <rect x="0" y="0" width="360" height="210" rx="20" ry="20" />
    </clipPath>
    <clipPath id="modal-img-clip">
      <rect x="0" y="0" width="460" height="150" rx="16" ry="16" />
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="800" fill="url(#bg-grad)" />

  <!-- Ambient Glow Orbs -->
  <circle cx="150" cy="180" r="160" fill="#52B737" opacity="0.12" filter="blur(60px)" />
  <circle cx="1120" cy="220" r="190" fill="#E83B87" opacity="0.15" filter="blur(70px)" />
  <circle cx="640" cy="720" r="220" fill="#5A1846" opacity="0.08" filter="blur(80px)" />

  <!-- Top Brand Banner / Title -->
  <g transform="translate(60, 42)">
    <rect x="0" y="0" width="1160" height="60" rx="18" fill="#FFFFFF" fill-opacity="0.6" stroke="rgba(90, 24, 70, 0.08)" stroke-width="1" />
    <circle cx="34" cy="30" r="16" fill="#52B737" opacity="0.15" />
    <text x="34" y="36" text-anchor="middle" font-size="18" fill="#52B737">✨</text>
    
    <text x="64" y="32" class="font-heading" font-size="20" font-weight="700" fill="#5A1846">HAPPY MOMENTS <tspan font-weight="400" font-size="16" fill="#E83B87">• Propuesta de Selección de Sabores</tspan></text>
    <text x="1135" y="35" text-anchor="end" class="font-body" font-size="13" font-weight="600" fill="#6E465F">UI/UX Component System</text>
  </g>

  <!-- ================= LEFT COLUMN: OPCIÓN 1 (TARJETA DIRECTA) ================= -->
  <g transform="translate(80, 130)">
    <!-- Section Header Tag -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#5A1846" />
    <text x="110" y="19" text-anchor="middle" class="font-body" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">OPCIÓN 1: CHIPS EN TARJETA</text>
    <text x="0" y="48" class="font-body" font-size="13" fill="#6E465F">Selección rápida y directa sin abrir modales adicionales.</text>

    <!-- Product Card Container -->
    <g transform="translate(0, 65)" class="card-shadow">
      <!-- Card Background -->
      <rect x="0" y="0" width="370" height="525" rx="22" fill="url(#card-surface)" stroke="rgba(82, 183, 55, 0.35)" stroke-width="1.5" />

      <!-- Image Area -->
      <g transform="translate(10, 10)">
        <rect x="0" y="0" width="350" height="190" rx="16" fill="url(#brownie-grad)" />
        
        <!-- Brownie graphics details -->
        <rect x="50" y="45" width="115" height="100" rx="12" fill="#3a1608" transform="rotate(-6 107 95)" />
        <rect x="45" y="40" width="115" height="100" rx="12" fill="#5c260f" transform="rotate(-6 102 90)" stroke="#743316" stroke-width="1" />
        
        <!-- Arequipe drip / swirl on brownie 2 -->
        <rect x="180" y="50" width="120" height="100" rx="12" fill="#3a1608" transform="rotate(5 240 100)" />
        <rect x="175" y="45" width="120" height="100" rx="12" fill="#5c260f" transform="rotate(5 235 95)" stroke="#743316" stroke-width="1" />
        
        <!-- Caramel Swirl -->
        <path d="M 190 70 Q 220 85 240 65 T 285 85" fill="none" stroke="url(#arequipe-grad)" stroke-width="6" stroke-linecap="round" />
        <path d="M 200 95 Q 235 110 270 95" fill="none" stroke="url(#arequipe-grad)" stroke-width="5" stroke-linecap="round" />
        <circle cx="275" cy="115" r="4" fill="#f0a843" />

        <!-- Badges -->
        <rect x="12" y="12" width="68" height="24" rx="12" fill="url(#magenta-badge-grad)" class="glow-magenta" />
        <text x="46" y="28" text-anchor="middle" class="font-body" font-size="11" font-weight="800" fill="#FFFFFF">FUSIÓN</text>

        <rect x="250" y="152" width="88" height="24" rx="8" fill="rgba(55, 10, 42, 0.85)" />
        <text x="294" y="168" text-anchor="middle" class="font-body" font-size="11" font-weight="600" fill="#FFFFFF">2 unidades</text>
      </g>

      <!-- Card Body -->
      <g transform="translate(24, 222)">
        <text x="0" y="0" class="font-body" font-size="11" font-weight="800" fill="#3E9427" letter-spacing="1">BROWNIES</text>
        <text x="0" y="24" class="font-heading" font-size="20" font-weight="700" fill="#5A1846">Brownies Fusión x2 unidades</text>
        <text x="0" y="46" class="font-body" font-size="12" fill="#6E465F">Receta ancestral artesanal con textura melcochuda.</text>

        <!-- Flavor Selector Header -->
        <g transform="translate(0, 68)">
          <text x="0" y="0" class="font-body" font-size="12" font-weight="700" fill="#5A1846">Elige el sabor:</text>
          <text x="322" y="0" text-anchor="end" class="font-body" font-size="11" font-weight="600" fill="#E83B87">*Obligatorio</text>

          <!-- Flavor Chips Row -->
          <!-- Chip 1: Chocolate (Selected) -->
          <g transform="translate(0, 12)">
            <rect x="0" y="0" width="102" height="36" rx="18" fill="#EBF7E8" stroke="#52B737" stroke-width="2" />
            <text x="14" y="23" font-size="14">🍫</text>
            <text x="34" y="22" class="font-body" font-size="11.5" font-weight="700" fill="#2E701C">Choco</text>
            <circle cx="88" cy="18" r="7" fill="#52B737" />
            <path d="M 85 18 L 87 20 L 91 16" fill="none" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" />
          </g>

          <!-- Chip 2: Arequipe (Default) -->
          <g transform="translate(108, 12)">
            <rect x="0" y="0" width="108" height="36" rx="18" fill="#FFFFFF" stroke="rgba(90, 24, 70, 0.15)" stroke-width="1.2" />
            <text x="12" y="23" font-size="14">🍯</text>
            <text x="32" y="22" class="font-body" font-size="11.5" font-weight="600" fill="#5A1846">Arequipe</text>
          </g>

          <!-- Chip 3: Mixto (Default) -->
          <g transform="translate(222, 12)">
            <rect x="0" y="0" width="100" height="36" rx="18" fill="#FFFFFF" stroke="rgba(90, 24, 70, 0.15)" stroke-width="1.2" />
            <text x="12" y="23" font-size="14">✨</text>
            <text x="32" y="22" class="font-body" font-size="11.5" font-weight="600" fill="#5A1846">Mixto</text>
          </g>
        </g>

        <!-- Divider Line -->
        <line x1="0" y1="140" x2="322" y2="140" stroke="rgba(90, 24, 70, 0.08)" stroke-width="1" />

        <!-- Price & Action Button -->
        <g transform="translate(0, 162)">
          <text x="0" y="6" class="font-body" font-size="11" font-weight="500" fill="#967389">Precio x paquete</text>
          <text x="0" y="32" class="font-heading" font-size="22" font-weight="800" fill="#5A1846">$ 26.000</text>

          <!-- Button -->
          <g transform="translate(182, 2)" class="glow-green" cursor="pointer">
            <rect x="0" y="0" width="140" height="42" rx="21" fill="url(#green-btn-grad)" />
            <text x="70" y="26" text-anchor="middle" class="font-body" font-size="13" font-weight="700" fill="#FFFFFF">+ Añadir</text>
          </g>
        </g>
      </g>
    </g>
  </g>

  <!-- ================= RIGHT COLUMN: OPCIÓN 2 (MODAL DETALLADO) ================= -->
  <g transform="translate(560, 130)">
    <!-- Section Header Tag -->
    <rect x="0" y="0" width="250" height="28" rx="14" fill="#E83B87" class="glow-magenta" />
    <text x="125" y="19" text-anchor="middle" class="font-body" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">OPCIÓN 2: MODAL INTERACTIVO</text>
    <text x="0" y="48" class="font-body" font-size="13" fill="#6E465F">Ideal para pedidos con múltiples combinaciones e instrucciones.</text>

    <!-- Modal Container Preview -->
    <g transform="translate(0, 65)" class="modal-shadow">
      <!-- Modal Overlay Effect Background -->
      <rect x="-20" y="-15" width="660" height="555" rx="28" fill="#FFFFFF" stroke="rgba(232, 59, 135, 0.25)" stroke-width="1.5" />

      <!-- Modal Header -->
      <g transform="translate(15, 15)">
        <circle cx="20" cy="18" r="18" fill="#FCF1ED" />
        <text x="20" y="24" text-anchor="middle" font-size="16">✨</text>
        <text x="48" y="16" class="font-heading" font-size="19" font-weight="700" fill="#5A1846">Personaliza tus Brownies Fusión</text>
        <text x="48" y="32" class="font-body" font-size="12" fill="#6E465F">Selecciona el sabor de tu preferencia para este paquete (2 unidades)</text>

        <!-- Close 'X' Button -->
        <circle cx="585" cy="18" r="15" fill="#FCF1ED" />
        <text x="585" y="23" text-anchor="middle" font-size="14" font-weight="bold" fill="#6E465F">✕</text>
      </g>

      <!-- Flavor Option 1 (Selected Card) -->
      <g transform="translate(15, 75)">
        <rect x="0" y="0" width="590" height="68" rx="16" fill="#F4FAF1" stroke="#52B737" stroke-width="2" />
        
        <!-- Flavor Emoji Icon Container -->
        <circle cx="36" cy="34" r="22" fill="#52B737" fill-opacity="0.15" />
        <text x="36" y="41" text-anchor="middle" font-size="20">🍫</text>

        <!-- Texts -->
        <text x="70" y="28" class="font-heading" font-size="15" font-weight="700" fill="#2E701C">Brownie 100% Chocolate Clásico</text>
        <text x="70" y="48" class="font-body" font-size="12" fill="#527D49">Puro cacao premium 70% con nueces y textura suave (2 unidades)</text>

        <rect x="420" y="22" width="76" height="24" rx="12" fill="#52B737" />
        <text x="458" y="38" text-anchor="middle" class="font-body" font-size="10.5" font-weight="700" fill="#FFFFFF">FAVORITO</text>

        <!-- Radio button checked -->
        <circle cx="550" cy="34" r="11" fill="#52B737" />
        <circle cx="550" cy="34" r="4.5" fill="#FFFFFF" />
      </g>

      <!-- Flavor Option 2 (Arequipe) -->
      <g transform="translate(15, 155)">
        <rect x="0" y="0" width="590" height="68" rx="16" fill="#FFFFFF" stroke="rgba(90, 24, 70, 0.12)" stroke-width="1.2" />
        
        <circle cx="36" cy="34" r="22" fill="#F5B729" fill-opacity="0.15" />
        <text x="36" y="41" text-anchor="middle" font-size="20">🍯</text>

        <text x="70" y="28" class="font-heading" font-size="15" font-weight="700" fill="#5A1846">Brownie Relleno de Arequipe</text>
        <text x="70" y="48" class="font-body" font-size="12" fill="#6E465F">Dulce de leche artesanal colombiano fundido en el centro (2 unidades)</text>

        <!-- Radio button unchecked -->
        <circle cx="550" cy="34" r="11" fill="#FFFFFF" stroke="#967389" stroke-width="1.8" />
      </g>

      <!-- Flavor Option 3 (Combinado 1 y 1) -->
      <g transform="translate(15, 235)">
        <rect x="0" y="0" width="590" height="68" rx="16" fill="#FFFFFF" stroke="rgba(90, 24, 70, 0.12)" stroke-width="1.2" />
        
        <circle cx="36" cy="34" r="22" fill="#E83B87" fill-opacity="0.15" />
        <text x="36" y="41" text-anchor="middle" font-size="20">✨</text>

        <text x="70" y="28" class="font-heading" font-size="15" font-weight="700" fill="#5A1846">Dúo Mixto (1 Chocolate + 1 Arequipe)</text>
        <text x="70" y="48" class="font-body" font-size="12" fill="#6E465F">1 unidad de chocolate puro + 1 unidad con centro de arequipe</text>

        <!-- Radio button unchecked -->
        <circle cx="550" cy="34" r="11" fill="#FFFFFF" stroke="#967389" stroke-width="1.8" />
      </g>

      <!-- Special Notes / Notes input -->
      <g transform="translate(15, 318)">
        <text x="0" y="14" class="font-body" font-size="12" font-weight="700" fill="#5A1846">¿Alguna indicación especial? (Opcional):</text>
        <rect x="0" y="24" width="590" height="38" rx="10" fill="#FCF1ED" stroke="rgba(90, 24, 70, 0.08)" stroke-width="1" />
        <text x="14" y="48" class="font-body" font-size="12" fill="#967389">Ej: "Por favor enviar servilletas extra..."</text>
      </g>

      <!-- Modal Footer Divider -->
      <line x1="15" y1="390" x2="605" y2="390" stroke="rgba(90, 24, 70, 0.08)" stroke-width="1" />

      <!-- Modal Footer (Quantity + Submit Button) -->
      <g transform="translate(15, 410)">
        <!-- Quantity Stepper -->
        <g transform="translate(0, 0)">
          <text x="0" y="-4" class="font-body" font-size="11" font-weight="600" fill="#967389">Cantidad:</text>
          <rect x="0" y="6" width="120" height="42" rx="21" fill="#FCF1ED" stroke="rgba(90, 24, 70, 0.15)" stroke-width="1" />
          
          <!-- Minus -->
          <circle cx="21" cy="27" r="13" fill="#FFFFFF" />
          <text x="21" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#5A1846">-</text>

          <!-- Value -->
          <text x="60" y="33" text-anchor="middle" class="font-heading" font-size="16" font-weight="700" fill="#5A1846">1</text>

          <!-- Plus -->
          <circle cx="99" cy="27" r="13" fill="#52B737" />
          <text x="99" y="32" text-anchor="middle" font-size="14" font-weight="bold" fill="#FFFFFF">+</text>
        </g>

        <!-- Total and CTA Add Button -->
        <g transform="translate(160, 6)" class="glow-green" cursor="pointer">
          <rect x="0" y="0" width="430" height="48" rx="24" fill="url(#green-btn-grad)" />
          <text x="215" y="30" text-anchor="middle" class="font-heading" font-size="15" font-weight="700" fill="#FFFFFF">
            Agregar al Carrito • $ 26.000 COP
          </text>
        </g>
      </g>
    </g>
  </g>

  <!-- Bottom Recommendation Legend -->
  <g transform="translate(60, 742)">
    <rect x="0" y="0" width="1160" height="38" rx="12" fill="#5A1846" fill-opacity="0.05" />
    <text x="580" y="24" text-anchor="middle" class="font-body" font-size="13" font-weight="600" fill="#5A1846">
      💡 <tspan font-weight="700" fill="#3E9427">Recomendación UX:</tspan> La Opción 1 (Chips en Tarjeta) minimiza fricción de compra. El sabor seleccionado se añade automáticamente al mensaje de WhatsApp y al carrito.
    </text>
  </g>
</svg>

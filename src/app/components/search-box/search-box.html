<!-- Controls Bar (Search Box & Category Pills) -->
<div class="controls-bar">
  <div class="search-box">
    <span class="search-icon">🔍</span>
    <input type="text" placeholder="Buscar gomitas, brownies, galletas..." [value]="searchQuery"
      (input)="onSearchInput($event)" id="product-search-input" />
  </div>

  <div class="category-pills">
    <button *ngFor="let cat of categories" class="cat-pill" [class.active]="selectedCategory === cat"
      (click)="selectCategory(cat)">
      {{ cat }}
    </button>
  </div>
</div>

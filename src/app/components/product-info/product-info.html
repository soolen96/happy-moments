<section class="product-info-section" id="info-productos">
  <div class="product-info-wrapper">
    <div class="info-glow-orb"></div>

    <div class="product-info-grid">
      <div class="info-card">
        <img
          [src]="image1()"
          alt="Información sobre productos Happy Moments"
          class="info-image"
          loading="lazy"
        />
      </div>

      <div class="info-card">
        <img
          [src]="image2()"
          alt="Guía informativa de efectos y líneas Happy Moments"
          class="info-image"
          loading="lazy"
        />
      </div>
    </div>
  </div>
</section>

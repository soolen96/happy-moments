<div class="weekly-banner-wrapper">
  <!-- Main Banner Bar -->
  <div class="deals-banner" [class.has-active-promo]="promotionService.activePromotions().length > 0">
    <div class="banner-content">
      <div class="banner-badge">
        <span class="pulse-dot" *ngIf="promotionService.activePromotions().length > 0"></span>
        <img [src]="promotionService.activePromotions().length > 0 ? 'assets/icons/fire.svg' : 'assets/icons/sparkles.svg'"
             alt="Promo" class="inline-icon banner-badge-icon" />
        <span>{{ promotionService.activePromotions().length > 0 ? 'PROMO ACTIVA' : 'DÍAS DE DESCUENTO' }}</span>
      </div>

      <div class="banner-message" *ngIf="promotionService.activePromotions().length > 0; else noActivePromo">
        <strong>¡Hoy {{ promotionService.currentDayName() }}!</strong>
        <span class="promo-names">
          <ng-container *ngFor="let promo of promotionService.activePromotions(); let last = last">
            {{ promo.name }}<span *ngIf="promo.description"> ({{ promo.description }})</span>{{ !last ? ' • ' : '' }}
          </ng-container>
        </span>
      </div>

      <ng-template #noActivePromo>
        <div class="banner-message">
          <strong>Promos semanales:</strong>
          <span [innerHTML]="weeklyPromosSummary()"></span>
        </div>
      </ng-template>
    </div>
  </div>
</div>

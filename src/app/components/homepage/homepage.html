<div class="page-wrapper">
  <!-- Glowing Background Orbs in Logo Colors -->
  <div class="bg-orb orb-green"></div>
  <div class="bg-orb orb-magenta"></div>
  <div class="bg-orb orb-plum"></div>

  <!-- Header & Navigation -->
  <app-header
    [contactInfo]="contactInfo()"
    [isDarkMode]="isDarkMode()"
    (categorySelected)="selectCategory($event)"
    (themeToggled)="toggleTheme()">
  </app-header>

  <!-- Hero & Popular Products Carousel Component -->
  <app-product-carousel [popularProducts]="popularProducts()"></app-product-carousel>

  <!-- Product Catalog & Search Section -->
  <app-product-catalog
    [products]="filteredProducts()"
    [categories]="categories"
    [selectedCategory]="selectedCategory()"
    [searchQuery]="searchQuery()"
    (searchQueryChange)="searchQuery.set($event)"
    (categoryChange)="selectCategory($event)">
  </app-product-catalog>

  <!-- Combos Component -->
  <app-combos [combos]="combos()"></app-combos>

  <!-- Delivery Information Section -->
  <app-delivery-info></app-delivery-info>

  <!-- Product Information Section (Mockup / Infographics) -->
  <app-product-info></app-product-info>

  <!-- Spotify Playlist Section ("La Frecuencia Ancestral") -->
  <app-spotify-section></app-spotify-section>

  <!-- Shopping Cart Component -->
  <app-cart [contactInfo]="contactInfo()"></app-cart>

  <!-- Footer with Contact Info -->
  <app-footer
    [contactInfo]="contactInfo()"
    [footerDescription]="footerDescription()"
    [footerText]="footerText()"
    [isDarkMode]="isDarkMode()">
  </app-footer>
</div>

<!-- Hero & Informational Carousel -->
<section class="hero-carousel-section" id="novedades">
  <div class="section-badge">
    <span><img src="assets/icons/leaf.svg" alt="Ancestral" class="inline-icon" /> EDIBLES ANCESTRALES & COMIDA ARTESANAL</span>
  </div>
  <h1 class="hero-heading">
    Descubre la magia de nuestros <br />
    <span class="gradient-title">Edibles Ancestrales</span>
  </h1>

  <!-- Carousel Container -->
  <div class="carousel-container" *ngIf="slides().length > 0">
    <button class="carousel-arrow prev" (click)="prevSlide()" aria-label="Imagen anterior">❮</button>

    <div class="carousel-track-wrapper">
      <div
        class="carousel-slide"
        *ngFor="let item of slides(); let i = index"
        [class.active]="i === carouselIndex"
      >
        <div class="slide-content" *ngIf="i === carouselIndex">
          <div class="slide-image-box">
            <img
              [src]="item.image"
              [alt]="item.alt"
              class="carousel-info-img"
              [class.fill-cover]="item.fit === 'cover'"
              [style.object-position]="item.position || 'center'"
              loading="eager"
            />
          </div>
        </div>
      </div>
    </div>

    <button class="carousel-arrow next" (click)="nextSlide()" aria-label="Imagen siguiente">❯</button>

    <!-- Indicators -->
    <div class="carousel-indicators">
      <button
        *ngFor="let item of slides(); let i = index"
        class="indicator-dot"
        [class.active]="i === carouselIndex"
        (click)="setSlide(i)"
        [attr.aria-label]="'Ir a ' + item.alt"
      ></button>
    </div>
  </div>
</section>

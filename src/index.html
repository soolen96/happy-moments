<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8" />
  <title>Happy Moments</title>
  <base href="/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Happy Moments comida artesanal para acompañar tus mejores momentos" />
  <link rel="icon" type="image/png" href="favicon.png" />
  <link rel="shortcut icon" href="favicon.ico" />
  <style>
    .initial-splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      margin: 0;
      padding: 0;
    }

    .initial-splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .initial-splash-mascot {
      width: 220px;
      max-width: 65vw;
      max-height: 45vh;
      height: auto;
      object-fit: contain;
      animation: mascotPulseFloat 2.4s ease-in-out infinite;
    }

    .initial-splash-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .initial-splash-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: dotBounce 1.2s infinite ease-in-out both;
    }

    .initial-splash-dots span:nth-child(1) {
      background-color: #e83b87;
      animation-delay: -0.32s;
    }

    .initial-splash-dots span:nth-child(2) {
      background-color: #52b737;
      animation-delay: -0.16s;
    }

    .initial-splash-dots span:nth-child(3) {
      background-color: #f5b729;
      animation-delay: 0s;
    }

    @keyframes mascotPulseFloat {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-8px) scale(1.02);
      }
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.4;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <app-root>
    <div class="initial-splash-container">
      <div class="initial-splash-content">
        <img src="assets/mascot-eating-gummy.png" alt="Happy Moments" class="initial-splash-mascot" />
        <div class="initial-splash-dots">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </div>
    </div>
  </app-root>
</body>

</html>

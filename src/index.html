  <script>
    (function() {
      try {
        const savedTheme = localStorage.getItem('happy_moments_theme');
        if (savedTheme === 'dark') {
          document.documentElement.classList.add('dark-mode');
          if (document.body) {
            document.body.classList.add('dark-mode');
          } else {
            document.addEventListener('DOMContentLoaded', function() {
              document.body.classList.add('dark-mode');
            });
          }
        }
      } catch (e) {}
    })();
  </script>
  <style>
    html.dark-mode,
    html.dark-mode body,
    body.dark-mode {
      background-color: #12030f;
    }

    .initial-splash-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      margin: 0;
      padding: 0;
    }

    html.dark-mode .initial-splash-container,
    body.dark-mode .initial-splash-container {
      background-color: #12030f;
    }

    .initial-splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
    }

    .initial-splash-logo,
    .initial-splash-mascot {
      width: 220px;
      max-width: 65vw;
      max-height: 45vh;
      height: auto;
      object-fit: contain;
      animation: logoPulseFloat 2.4s ease-in-out infinite;
    }

    .splash-logo-light {
      display: block;
    }

    .splash-logo-dark {
      display: none;
    }

    html.dark-mode .splash-logo-light,
    body.dark-mode .splash-logo-light {
      display: none;
    }

    html.dark-mode .splash-logo-dark,
    body.dark-mode .splash-logo-dark {
      display: block;
    }

    .initial-splash-dots {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .initial-splash-dots span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
      animation: dotBounce 1.2s infinite ease-in-out both;
    }

    .initial-splash-dots span:nth-child(1) {
      background-color: #e83b87;
      animation-delay: -0.32s;
    }

    .initial-splash-dots span:nth-child(2) {
      background-color: #52b737;
      animation-delay: -0.16s;
    }

    .initial-splash-dots span:nth-child(3) {
      background-color: #f5b729;
      animation-delay: 0s;
    }

    @keyframes logoPulseFloat {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-8px) scale(1.02);
      }
    }

    @keyframes mascotPulseFloat {

      0%,
      100% {
        transform: translateY(0px) scale(1);
      }

      50% {
        transform: translateY(-8px) scale(1.02);
      }
    }

    @keyframes dotBounce {

      0%,
      80%,
      100% {
        transform: scale(0.6);
        opacity: 0.4;
      }

      40% {
        transform: scale(1.2);
        opacity: 1;
      }
    }
  </style>
